name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync
      - name: Offline tests (helpers + documented loads behavior)
        run: uv run python -m pytest -q
      - name: Offline demo
        run: uv run python examples/offline_demo.py
